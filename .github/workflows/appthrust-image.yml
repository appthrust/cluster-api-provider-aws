name: Build and attest AppThrust CAPA image

on:
  push:
    tags: ['appthrust-v*']

permissions: {}

env:
  IMAGE: ghcr.io/appthrust/platform/cluster-api-provider-aws

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.event_name == 'push' && !github.event.deleted && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/appthrust-v')
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GHCR_TOKEN"

      - name: Build and push only this runner's image manifest by digest
        env:
          BUILDKIT_IMAGE: moby/buildkit:v0.35.0@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb
          GO_IMAGE: golang:1.25.12@sha256:dbeddb5e728ea4b5ba7920574413e311025ffa42d196793857e4d160e8dfe60d
        run: |
          [[ $(dpkg --print-architecture) == "$ARCH" && $(git rev-parse HEAD) == "$GITHUB_SHA" ]]
          # version.sh uses unfiltered git describe. Keep only the immutable upstream
          # release tag, not the non-SemVer triggering tag or any other fork tags.
          [[ $(git rev-parse refs/tags/v2.13.0) == 9d3c4c0c07e739cd0a0d616adf76f2a294ec91de ]]
          git merge-base --is-ancestor refs/tags/v2.13.0 HEAD
          git for-each-ref --exclude=refs/tags/v2.13.0 --format='delete %(refname)' refs/tags | git update-ref --stdin
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          export SOURCE_DATE_EPOCH
          source ./hack/version.sh
          link_flags=$(version::ldflags)

          # A new docker-container builder on a fresh hosted VM: the Dockerfile's
          # cache mounts exist only inside this job. No external cache is restored.
          docker buildx create --name capa --driver docker-container --driver-opt "image=$BUILDKIT_IMAGE"
          docker buildx build --builder capa --platform "linux/$ARCH" \
            --build-arg "ARCH=$ARCH" --build-arg "builder_image=$GO_IMAGE" --build-arg "LDFLAGS=$link_flags" \
            --provenance=false --sbom=false --metadata-file "$RUNNER_TEMP/build.json" \
            --output "type=image,name=$IMAGE,push=true,push-by-digest=true,name-canonical=true,oci-mediatypes=true" .
          jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' \
            "$RUNNER_TEMP/build.json" > "$RUNNER_TEMP/digest"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digest
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && !github.event.deleted && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/appthrust-v')
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      id-token: write
      attestations: write
    steps:
      # Same-run downloads, explicitly attempt-qualified: a partial rerun must
      # not reuse a successful build from an earlier attempt. Rerun all jobs.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-${{ github.run_id }}-${{ github.run_attempt }}-amd64
          path: ${{ runner.temp }}/amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-${{ github.run_id }}-${{ github.run_attempt }}-arm64
          path: ${{ runner.temp }}/arm64
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GHCR_TOKEN"

      - name: Verify child configs, assemble the index, and verify the published bytes
        id: verify
        working-directory: ${{ runner.temp }}
        run: |
          declare -A child
          for arch in amd64 arm64; do
            digest=$(<"$arch/digest")
            [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]
            child[$arch]=$digest
            skopeo inspect --raw --config "docker://$IMAGE@$digest" | jq -e --arg arch "$arch" '
              .os == "linux" and .architecture == $arch and .rootfs.type == "layers" and
              .config.Entrypoint == ["/manager"]'
          done
          tag="v2.13.0-token-refresh-${GITHUB_SHA:0:10}"
          docker buildx imagetools create --tag "$IMAGE:$tag" "$IMAGE@${child[amd64]}" "$IMAGE@${child[arm64]}"
          skopeo inspect --raw "docker://$IMAGE:$tag" > index.json
          index="sha256:$(sha256sum index.json | cut -d' ' -f1)"
          jq -e --arg amd64 "${child[amd64]}" --arg arm64 "${child[arm64]}" '
            .schemaVersion == 2 and .mediaType == "application/vnd.oci.image.index.v1+json" and
            all(.manifests[]; .mediaType == "application/vnd.oci.image.manifest.v1+json" and .artifactType == null) and
            ([.manifests[] | [.platform.os, .platform.architecture, .digest]] | sort) ==
              [["linux", "amd64", $amd64], ["linux", "arm64", $arm64]]' index.json
          skopeo inspect --raw "docker://$IMAGE@$index" | cmp - index.json
          printf 'index=%s\namd64=%s\narm64=%s\n' "$index" "${child[amd64]}" "${child[arm64]}" >> "$GITHUB_OUTPUT"

      - name: Attest the index
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.verify.outputs.index }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest the amd64 child
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.verify.outputs.amd64 }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest the arm64 child
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.verify.outputs.arm64 }}
          push-to-registry: true
          create-storage-record: false

      - name: Sign the verified index with keyless cosign
        env:
          COSIGN_IMAGE: gcr.io/projectsigstore/cosign:v3.1.3@sha256:9e5c2f2edc34351160407ca3416c61855bdf9403c3c5936e0f0be7fc261611b8
          INDEX: ${{ steps.verify.outputs.index }}
        run: |
          # Use the binary from the pinned image, with the runner's OIDC and GHCR credentials.
          container=$(docker create "$COSIGN_IMAGE")
          docker cp "$container:/ko-app/cosign" "$RUNNER_TEMP/cosign"
          docker rm "$container"
          "$RUNNER_TEMP/cosign" sign --yes "$IMAGE@$INDEX"

      - name: Summarize signed release
        env:
          INDEX: ${{ steps.verify.outputs.index }}
          AMD64: ${{ steps.verify.outputs.amd64 }}
          ARM64: ${{ steps.verify.outputs.arm64 }}
        run: |
          printf 'Image: %s:v2.13.0-token-refresh-%s\n\n' "$IMAGE" "${GITHUB_SHA:0:10}" >> "$GITHUB_STEP_SUMMARY"
          printf '| Subject | Digest |\n|---|---|\n| Index | %s |\n| linux/amd64 | %s |\n| linux/arm64 | %s |\n' \
            "$INDEX" "$AMD64" "$ARM64" >> "$GITHUB_STEP_SUMMARY"
